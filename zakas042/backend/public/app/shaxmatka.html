  if (res.status === "checked_in") return "occupied";

/* ============================== API KLIENT ==============================
   FAZA 3 — backend bilan aloqa.

   Manba: 02-DATABASE-SXEMA.md §3 — API javobi frontend kutgan
   shaklda keladi (guestName flatten, Decimal→number, sana string),

   Xato holatida (TZ 17-band) — foydalanuvchiga tushunarli xabar,
   mavjud conflictMsg mexanizmi orqali.
======================================================================== */

// Bo'sh satr = nisbiy manzil ("/api/rooms"). Backend frontendni o'zi
// xizmat qilgani uchun origin bir xil — CORS ham, port sozlamasi ham
// kerak emas. `??` ishlatiladi, `||` emas: bo'sh satr haqiqiy qiymat.
const API_BASE = window.API_BASE ?? "";

/**
 * JWT token — auth yoqilganda kerak (TZ 18-band, 09-fayl §4).
 *
 * Brauzerning `WebSocket` API'si maxsus sarlavha yubora olmaydi,
 * shuning uchun token URL parametri orqali beriladi.
 *
 * Hozircha `window.AUTH_TOKEN` dan olinadi — Shaxmatka login
 * ekranisiz ishlaydi va dev muhitida `AUTH_REQUIRED=false`.
 * Login qo'shilganda bu yer o'zgarmaydi: token o'sha o'zgaruvchiga
 * yoziladi.
 */
function getAuthToken() {
  try {
    return window.AUTH_TOKEN || localStorage.getItem("pms_token") || "";
  } catch {
    return window.AUTH_TOKEN || "";
  }
}

class ApiError extends Error {
  constructor(message, status, code) {
    super(message);
    this.status = status;
    this.code = code;
  }
}

async function apiFetch(path, options = {}) {
  let res;
  try {
    const token = getAuthToken();
    res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        // Auth yoqilganda barcha /api/* so'rovlar token talab qiladi
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
        ...(options.headers || {}),
      },
    });
  } catch (e) {
    throw new ApiError("Serverga ulanib bo'lmadi. Internetni tekshiring.", 0, "NETWORK");
  }

  if (res.status === 204) return null;

  let body;
  try {
    body = await res.json();
  } catch {
    throw new ApiError("Serverdan noto'g'ri javob keldi.", res.status, "BAD_RESPONSE");
  }

  if (!res.ok) {
    throw new ApiError(body?.error || "Noma'lum xato", res.status, body?.code);
  }
  return body;
}

/* ========================================================================
   FAZA 8 — REAL-TIME (WebSocket)

   Manba: 09-REALTIME-WEBSOCKET.md §3, §5 | TZ 4, 15-band

   TZ 4: "Admin sahifani refresh qilmasdan ham yangi bronni ko'rishi
   uchun WebSocket/real-time update ishlatilsin."

   MUHIM PRINTSIP (09-fayl §5): WebSocket faqat "delta" yetkazish
   vositasi, HAQIQAT MANBAI EMAS. Ulanish uzilganda o'tkazib
   yuborilgan event'lar bo'ladi, shuning uchun qayta ulanganda
   to'liq `reload()` chaqiriladi.

   Server tomon payload'ni `serializeReservation` bilan yuboradi —
   ayni `api.reservations()` qaytaradigan shakl. Shuning uchun
   konvertatsiya kerak emas: to'g'ridan-to'g'ri massivga qo'shamiz.
======================================================================== */

// API_BASE bo'sh bo'lsa (nisbiy rejim) WebSocket manzili sahifaning
// o'z origin'idan quriladi: https -> wss, http -> ws.
const WS_URL = (
  window.WS_URL
  || (API_BASE
        ? API_BASE.replace(/^http/, "ws")
        : location.origin.replace(/^http/, "ws"))
) + "/ws";


/**
 * Avtomatik qayta ulanadigan WebSocket.
 *
 * Qayta ulanish: 1s, 2s, 4s ... 30s gacha (exponential backoff).
 * Server qayta ishga tushganda darhol bosim bermaslik uchun jitter.
 */
function createRealtimeClient({ onEvent, onStatus }) {
  let ws = null;
  let closed = false;
  let attempt = 0;
  let timer = null;
  /** Server qayta ishga tushganini aniqlash uchun (09-fayl §5) */
  let lastServerStartedAt = null;

  function connect() {
    if (closed) return;

    try {
      const token = getAuthToken();
      ws = new WebSocket(token ? `${WS_URL}?token=${encodeURIComponent(token)}` : WS_URL);
    } catch {
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      attempt = 0;
      onStatus("online");
    };

    ws.onmessage = (ev) => {
      if (ev.data === "pong") return;

      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }

      // Ulanish tasdig'i. Agar server ID o'zgargan bo'lsa — restart
      // yoki uzoq uzilish: o'tkazib yuborilgan event'lar bor,
      // to'liq qayta yuklash kerak (09-fayl §5).
      if (msg.type === "connected") {
        const restarted = lastServerStartedAt && lastServerStartedAt !== msg.serverStartedAt;
        lastServerStartedAt = msg.serverStartedAt;
        if (restarted) onEvent({ type: "__resync" });
        return;
      }

      onEvent(msg);
    };

    ws.onclose = () => {
      onStatus("offline");
      scheduleReconnect();
    };

    ws.onerror = () => {
      // onclose baribir chaqiriladi — shu yerda hech narsa qilmaymiz
    };
  }

  function scheduleReconnect() {
    if (closed || timer) return;
    const delay = Math.min(1000 * 2 ** attempt, 30000) + Math.random() * 500;
    attempt++;
    timer = setTimeout(() => { timer = null; connect(); }, delay);
  }

  connect();

  return {
    close() {
      closed = true;
      if (timer) clearTimeout(timer);
      if (ws) { ws.onclose = null; ws.close(); }
    },
  };
}

/* ==========================================================================
   LOGIN EKRANI — TZ 18-band

   Manba: 10-SECURITY-VA-SYNCLOG.md §1 (3-talab: JWT authentication)

   NEGA KERAK: `AUTH_REQUIRED=true` bo'lganda barcha `/api/*` so'rovlar
   token talab qiladi. Usiz Shaxmatka "Kirish talab qilinadi" xatosini
   ko'rsatib to'xtab qolardi va token olish yo'li bo'lmasdi.

   Dev muhitida (`AUTH_REQUIRED=false`) bu ekran KO'RINMAYDI: birinchi
   so'rov muvaffaqiyatli o'tadi va login talab qilinmaydi.

   Token `localStorage` da saqlanadi — sahifa yangilanganda qayta
   kirish shart emas. Muddati tugasa (12 soat) keyingi so'rov 401
   beradi va ekran o'zi qaytadi.
========================================================================== */

function LoginScreen({ onSuccess }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e?.preventDefault();
    if (!email || !password) return;

    setBusy(true);
    setError(null);
    try {
      const res = await api.login(email, password);
      try {
        localStorage.setItem("pms_token", res.token);
      } catch {
        // Shaxsiy rejim yoki bloklangan saqlash — token faqat
        // shu sessiyada ishlaydi
        window.AUTH_TOKEN = res.token;
      }
      onSuccess(res.user);
    } catch (err) {
      // Server ataylab bir xil xabar beradi: qaysi email mavjudligi
      // oshkor qilinmaydi (10-fayl §3)
      setError(err.message || "Kirish amalga oshmadi");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="h-screen w-full flex items-center justify-center bg-gray-50">
      <form onSubmit={submit} className="w-80 bg-white border border-gray-200 rounded-lg shadow-sm p-5 space-y-4">
        <div className="flex items-center gap-2">
          <div className="h-8 w-8 rounded-md bg-blue-600 flex items-center justify-center text-white font-bold text-xs">SH</div>
          <div>
            <div className="text-sm font-semibold text-gray-800">Shaxmatka</div>
            <div className="text-xs text-gray-500">Imron Hotel PMS</div>
          </div>
        </div>

        <Field label="Email">
          <TextInput
            type="email" value={email} autoFocus
            onChange={(e) => setEmail(e.target.value)}
            placeholder="admin@imron.local"
          />
        </Field>

        <Field label="Parol">
          <TextInput
            type="password" value={password}
            onChange={(e) => setPassword(e.target.value)}
            placeholder="••••••••"
          />
        </Field>

        {error && (
          <div className="rounded-md bg-red-50 border border-red-200 px-2 py-1.5 text-xs text-red-700">
            {error}
          </div>
        )}

        <Btn variant="primary" className="w-full justify-center" type="submit" disabled={busy}>
          {busy ? "Kirilmoqda…" : "Kirish"}
        </Btn>
      </form>
    </div>
  );
}

/* ============================== APP ============================== */

function App() {
  const today = useMemo(() => startOfDay(new Date()), []);

  // FAZA 3: ma'lumot backenddan keladi (avval buildRooms/buildSeedReservations edi)
  const [rooms, setRooms] = useState([]);
  const [reservations, setReservations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  /**
   * Kirish talab qilinadimi (TZ 18-band).
   *
   * Birinchi so'rov 401 bersa `true` bo'ladi va login ekrani
   * ko'rsatiladi. Dev muhitida (`AUTH_REQUIRED=false`) hech qachon
   * yoqilmaydi.
   */
  const [needsLogin, setNeedsLogin] = useState(false);

  const [viewStart, setViewStart] = useState(addDays(today, -1));
  const [rangeLen, setRangeLen] = useState(14);
  const [zoomIdx, setZoomIdx] = useState(2);
  const cellWidth = ZOOM_LEVELS[zoomIdx];

  const [search, setSearch] = useState("");
  const [filters, setFilters] = useState({ floor: "all", type: "all", status: "all", source: "all", resStatus: "all" });
  const [filtersOpen, setFiltersOpen] = useState(false);

  /**
   * Xona turlari bo'yicha JORIY narx — `RatePlan` dan.
   *
   * Q8: avtomatik o'suvchi formula olib tashlandi. Narxni admin
   * Narxlar panelida qo'lda belgilaydi, bu yerda faqat o'qiladi
   * (yangi bron uchun taklif narxi sifatida).
   */
  const [typePrices, setTypePrices] = useState({});
  const [pricingOpen, setPricingOpen] = useState(false);

  const [detailId, setDetailId] = useState(null);
  const [createDraft, setCreateDraft] = useState(null); // {roomId, checkIn, checkOut}
  const [subPanel, setSubPanel] = useState(null); // 'payment' | 'changeRoom' | 'changeDates' | 'checkout' | 'charge'
  // Bekor qilish jarimasi ogohlantirishi (SAVOLLAR.md S11)
  const [cancelPrompt, setCancelPrompt] = useState(null);
  const [roomMenu, setRoomMenu] = useState(null); // {roomId, x, y}
  const [conflictMsg, setConflictMsg] = useState(null);
  /** FAZA 8: 'online' | 'offline' — real-time ulanish holati */
  const [wsStatus, setWsStatus] = useState("offline");

  const gridRef = useRef(null);
  const dragRef = useRef(null);
  const [dragPreview, setDragPreview] = useState(null);

  const days = useMemo(() => Array.from({ length: rangeLen }, (_, i) => addDays(viewStart, i)), [viewStart, rangeLen]);

  /* ------------------------------ ma'lumot yuklash (FAZA 3) ------------------------------ */

  const reload = useCallback(async () => {
    try {
      const todayKey = toKey(today);
      const [roomsData, resData, rateRows, typeRows] = await Promise.all([
        api.rooms(),
        api.reservations(),
        // Bugungi narxlar — yangi bron uchun taklif (Q8)
        api.ratePlans(todayKey, todayKey).catch(() => []),
        // Xona turlari — nomi va koeffitsienti (yuqoridagi ROOM_TYPES)
        api.roomTypes().catch(() => []),
      ]);

      // ROOM_TYPES ni o'rnida to'ldiramiz: obyekt havolasi o'zgarmaydi,
      // shuning uchun uni o'qiydigan komponentlar tegilmaydi.
      if (Array.isArray(typeRows) && typeRows.length > 0) {
        for (const k of Object.keys(ROOM_TYPES)) delete ROOM_TYPES[k];
        for (const t of typeRows) {
          ROOM_TYPES[t.id] = { label: t.label, multiplier: t.multiplier ?? 1 };
        }
      }

      setRooms(roomsData);
      setReservations(resData);

      const prices = {};
      for (const r of rateRows) prices[r.roomTypeId] = r.price;
      setTypePrices(prices);

      setLoadError(null);
    } catch (e) {
      if (e.status === 401) {
        // Token yo'q yoki muddati tugagan — login ekrani
        setNeedsLogin(true);
        setLoadError(null);
      } else {
        setLoadError(e.message);
      }
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { reload(); }, [reload]);

  /**
   * API xatosini foydalanuvchiga ko'rsatadi.
   * 409 (xona band) — mavjud conflictMsg mexanizmi orqali,
   * boshqalari ham shu yerda.
   */
  const handleApiError = useCallback((e) => {
    setConflictMsg(e.message || "Amalni bajarib bo'lmadi.");
  }, []);

  /** Bitta bronni javobdagi yangi holat bilan almashtiradi */
  const applyReservation = useCallback((updated) => {
    setReservations((rs) => {
      const i = rs.findIndex((r) => r.id === updated.id);
      return i === -1 ? [...rs, updated] : rs.map((r) => (r.id === updated.id ? updated : r));
    });
  }, []);

  /** Xona holatlari server tomonda hisoblanadi — qayta o'qiymiz */
  const refreshRooms = useCallback(async () => {
    try { setRooms(await api.rooms()); } catch { /* jim — asosiy amal bajarilgan */ }
  }, []);

  /* ------------------------------ FAZA 8: real-time event'lar ------------------------------ */

  /**
   * Server event'ini ekranga qo'llaydi.
   *
   * Manba: 09-REALTIME-WEBSOCKET.md §3 — TZ 15-band talab qilgan
   * oltita event. Payload `api.reservations()` shakli bilan aynan
   * bir xil, shuning uchun `applyReservation` to'g'ridan-to'g'ri
   * ishlaydi.
   *
   * MUHIM: event o'z amalimizdan ham qaytib keladi (biz bron
   * yaratsak, server hammaga yuboradi — bizga ham). Bu muammo
   * emas: `applyReservation` id bo'yicha almashtiradi, dublikat
   * yaratmaydi. Natija — bir xil, faqat qayta yozilgan.
   */
  const handleRealtime = useCallback((msg) => {
    switch (msg.type) {
      // Uzoq uzilishdan keyin — o'tkazib yuborilgan event'lar bor
      case "__resync":
        reload();
        break;

      case "reservation.created":
      case "reservation.updated":
        applyReservation(msg.reservation);
        if (msg.room) setRooms((rs) => rs.map((r) => (r.id === msg.room.id ? msg.room : r)));
        break;

      case "reservation.cancelled":
        // Bron massivda QOLADI, statusi 'cancelled' bo'ladi —
        // TZ 2-band: tarix o'chirilmaydi. Grid esa bekor
        // qilinganlarni ko'rsatmaydi (pastdagi filtr), shuning
        // uchun xona bo'shab ko'rinadi. Filtr "Bekor qilingan"ga
        // qo'yilsa bron yana ko'rinadi.
        applyReservation(msg.reservation);
        if (msg.room) setRooms((rs) => rs.map((r) => (r.id === msg.room.id ? msg.room : r)));
        break;

      case "payment.updated":
        // To'lov holati yangilanadi: kartochkadagi qarz summasi
        // va detail modaldagi 'Qoldiq' qatori (TZ 14-band)
        applyReservation(msg.reservation);
        break;

      case "room.status.changed":
        setRooms((rs) => rs.map((r) => (r.id === msg.room.id ? msg.room : r)));
        break;

      case "availability.changed":
        // Shaxmatka bandlikni bronlardan o'zi hisoblaydi — bu event
        // Website/Admin panel uchun. E'tiborsiz qoldiramiz.
        break;

      default:
        // sync.failed, webhook.needs_attention, rate.sync.updated —
        // admin panel event'lari, Shaxmatka ko'rsatmaydi.
        break;
    }
  }, [reload, applyReservation]);

  useEffect(() => {
    const client = createRealtimeClient({
      onEvent: handleRealtime,
      onStatus: setWsStatus,
    });
    return () => client.close();
  }, [handleRealtime]);

  /* ------------------------------ narxlar (TZ 7-band, Q8) ------------------------------ */
  /**
   * Yangi bron uchun taklif narxi.
   *
   * `RatePlan` da bugungi kunga narx bo'lsa o'sha, bo'lmasa 0 —
   * admin qo'lda kiritadi. Avtomatik hisoblash YO'Q (Q8).
   */
  const priceForType = useCallback(
    (type) => typePrices[type] ?? 0,
    [typePrices]
  );

  /* ------------------------------ availability check ------------------------------ */
  const isRoomAvailable = useCallback((roomId, checkIn, checkOut, excludeId) => {
    const ci = fromKey(checkIn), co = fromKey(checkOut);
    return !reservations.some((r) => {
      if (r.id === excludeId) return false;
      if (r.roomId !== roomId) return false;
      if (r.status === "cancelled") return false;
      const rci = fromKey(r.checkIn), rco = fromKey(r.checkOut);
      return ci < rco && co > rci;
    });
  }, [reservations]);

  const availableRoomsFor = useCallback((checkIn, checkOut, excludeId, roomType) => {
    return rooms.filter((rm) => (!roomType || rm.type === roomType || true) && isRoomAvailable(rm.id, checkIn, checkOut, excludeId));
  }, [rooms, isRoomAvailable]);

  /* ------------------------------ filtering ------------------------------ */
  const visibleRooms = useMemo(() => rooms.filter((r) => {
    if (filters.floor !== "all" && String(r.floor) !== filters.floor) return false;
    if (filters.type !== "all" && r.type !== filters.type) return false;
    if (filters.status !== "all" && r.status !== filters.status) return false;
    return true;
  }), [rooms, filters]);

  const searchLower = search.trim().toLowerCase();
  const matchesSearch = (r) => {
    if (!searchLower) return false;
    return (
      r.guestName.toLowerCase().includes(searchLower) ||
      (r.phone || "").toLowerCase().includes(searchLower) ||
      r.roomId.toLowerCase().includes(searchLower) ||
      r.id.toLowerCase().includes(searchLower)
    );
  };
  const matchesFilter = (r) => {
    if (filters.source !== "all" && r.source !== filters.source) return false;
    if (filters.resStatus !== "all" && r.status !== filters.resStatus) return false;
    return true;
  };

  /* ------------------------------ mutation helpers ------------------------------ */
  /**
   * Xona holatini qo'lda o'zgartirish (quick menu orqali).
   * Optimistik yangilanish — server xato bersa orqaga qaytariladi.
   */
  async function updateRoom(roomId, patch) {
    if (!patch.status) return;
    const prev = rooms.find((r) => r.id === roomId);
    setRooms((rs) => rs.map((r) => (r.id === roomId ? { ...r, ...patch } : r)));
    try {
      await api.setRoomStatus(roomId, patch.status);
    } catch (e) {
      if (prev) setRooms((rs) => rs.map((r) => (r.id === roomId ? prev : r)));
      handleApiError(e);
    }
  }

  /* ------ mutatsiyalar: hammasi backend orqali (FAZA 3) ------
     Har biri API'ni chaqiradi, javobdagi yangi holatni state'ga
     yozadi. Server availability va xona holatini o'zi hisoblaydi.
     Xato bo'lsa — conflictMsg orqali ko'rsatiladi (TZ 17-band).
  */

  async function createReservation(data) {
    const safePrice = Number.isFinite(Number(data.price)) ? Number(data.price) : 0;
    try {
      const created = await api.createReservation({
        roomId: data.roomId,
        guestName: data.guestName,
        phone: data.phone || undefined,
        checkIn: data.checkIn,
        checkOut: data.checkOut,
        adults: data.adults,
        children: data.children,
        source: data.source,
        pricePerNight: safePrice,
        priceReason: data.priceReason || undefined,
        notes: data.notes || undefined,
        withMeal: !!data.withMeal,
        initialPayment: data.paid > 0 ? Number(data.paid) : undefined,
        paymentMethod: "Naqd",
      });
      applyReservation(created);
      await refreshRooms();
      setCreateDraft(null);
    } catch (e) {
      handleApiError(e);
    }
  }

  async function checkIn(res) {
    try {
      applyReservation(await api.checkIn(res.id));
      await refreshRooms();
    } catch (e) { handleApiError(e); }
  }

  async function checkOutRes(res) {
    try {
      applyReservation(await api.checkOut(res.id));
      await refreshRooms();
      setSubPanel(null);
    } catch (e) { handleApiError(e); }
  }

  /**
   * Bekor qilish — jarima bo'lsa avval ogohlantiradi (S11).
   *
   * NEGA SO'RAYMIZ: kech bekor qilishda 1 kecha narxi olinadi.
   * Bu pul, shuning uchun xodim tasdiqlashi kerak — jarima
   * kutilmaganda paydo bo'lmasin.
   */
  async function cancelRes(res) {
    try {
      const preview = await api.cancelPreview(res.id);

      if (!preview.isFree) {
        setCancelPrompt({ res, fee: preview.fee, hours: preview.freeUntilHours });
        return;
      }

      await doCancel(res);
    } catch (e) { handleApiError(e); }
  }

  async function doCancel(res) {
    try {
      applyReservation(await api.cancel(res.id));
      await refreshRooms();
      setDetailId(null);
      setCancelPrompt(null);
    } catch (e) { handleApiError(e); }
  }

  async function addPayment(res, amount, method, note) {
    try {
      applyReservation(await api.addPayment(res.id, Number(amount), method, note || undefined));
    } catch (e) { handleApiError(e); }
  }

  async function reversePayment(res, payment) {
    try {
      applyReservation(await api.reversePayment(res.id, payment.id));
    } catch (e) { handleApiError(e); }
  }

  async function addCharge(res, label, amount) {
    try {
      applyReservation(await api.addCharge(res.id, label, Number(amount)));
    } catch (e) { handleApiError(e); }
  }

  async function changeRoom(res, newRoomId) {
    try {
      applyReservation(await api.changeRoom(res.id, newRoomId));
      await refreshRooms();
      setSubPanel(null);
    } catch (e) { handleApiError(e); }
  }

  async function changeDates(res, checkIn, checkOut) {
    if (fromKey(checkOut) <= fromKey(checkIn)) {
      setConflictMsg("Chiqish sanasi kirish sanasidan keyin bo'lishi kerak.");
      return;
    }
    try {
      applyReservation(await api.changeDates(res.id, checkIn, checkOut));
      await refreshRooms();
      setSubPanel(null);
    } catch (e) { handleApiError(e); }
  }

  /* ------------------------------ drag & drop ------------------------------ */
  function beginDrag(e, res, mode) {
    e.preventDefault();
    e.stopPropagation();
    const rowIndex = visibleRooms.findIndex((r) => r.id === res.roomId);
    dragRef.current = {
      resId: res.id, mode, startX: e.clientX, startY: e.clientY,
      origCheckIn: res.checkIn, origCheckOut: res.checkOut, origRoomId: res.roomId, origRowIndex: rowIndex,
    };
    setDragPreview({ resId: res.id, roomId: res.roomId, checkIn: res.checkIn, checkOut: res.checkOut, valid: true });
    window.addEventListener("mousemove", onDragMove);
    window.addEventListener("mouseup", onDragEnd);
  }

  function onDragMove(e) {
    const d = dragRef.current;
    if (!d) return;
    const dxDays = Math.round((e.clientX - d.startX) / cellWidth);
    let newRoomId = d.origRoomId;
    let newCheckIn = fromKey(d.origCheckIn);
    let newCheckOut = fromKey(d.origCheckOut);

    if (d.mode === "move") {
      newCheckIn = addDays(newCheckIn, dxDays);
      newCheckOut = addDays(newCheckOut, dxDays);
      const dyRows = Math.round((e.clientY - d.startY) / ROW_HEIGHT);
      const targetRow = clamp(d.origRowIndex + dyRows, 0, visibleRooms.length - 1);
      newRoomId = visibleRooms[targetRow]?.id || d.origRoomId;
    } else if (d.mode === "resize-left") {
      newCheckIn = addDays(newCheckIn, dxDays);
      if (diffDays(newCheckOut, newCheckIn) < 1) newCheckIn = addDays(newCheckOut, -1);
    } else if (d.mode === "resize-right") {
      newCheckOut = addDays(newCheckOut, dxDays);
      if (diffDays(newCheckOut, newCheckIn) < 1) newCheckOut = addDays(newCheckIn, 1);
    }

    const ciK = toKey(newCheckIn), coK = toKey(newCheckOut);
    const valid = isRoomAvailable(newRoomId, ciK, coK, d.resId);
    setDragPreview({ resId: d.resId, roomId: newRoomId, checkIn: ciK, checkOut: coK, valid });
  }

  /**
   * Drag&drop natijasini backendga yuboradi.
   * Sana va xona bir vaqtda o'zgarishi mumkin — ketma-ket ikki chaqiruv.
   * Xato bo'lsa to'liq qayta yuklanadi (holat aralashib ketmasligi uchun).
   */
  async function applyDragChange(resId, preview, datesChanged, roomChanged) {
    try {
      let updated;
      if (datesChanged) {
        updated = await api.changeDates(resId, preview.checkIn, preview.checkOut);
        applyReservation(updated);
      }
      if (roomChanged) {
        updated = await api.changeRoom(resId, preview.roomId);
        applyReservation(updated);
      }
      await refreshRooms();
    } catch (e) {
      handleApiError(e);
      reload();   // server bilan holat farq qilmasligi uchun
    }
  }

  function onDragEnd() {
    window.removeEventListener("mousemove", onDragMove);
    window.removeEventListener("mouseup", onDragEnd);
    const d = dragRef.current;
    dragRef.current = null;
    setDragPreview((preview) => {
      if (d && preview && preview.valid) {
        const roomChanged = preview.roomId !== d.origRoomId;
        const datesChanged = preview.checkIn !== d.origCheckIn || preview.checkOut !== d.origCheckOut;
        if (roomChanged || datesChanged) {
          // FAZA 3: backend orqali. Sana avval o'zgartiriladi, keyin xona —
          // shunda oraliq tekshiruvi to'g'ri bo'ladi.
          applyDragChange(d.resId, preview, datesChanged, roomChanged);
        }
      } else if (d && preview && !preview.valid) {
        setConflictMsg("XONA TO'QNASHUVI — bu xona ushbu sanalarda allaqachon band.");
      }
      return null;
    });
  }

  useEffect(() => () => {
    window.removeEventListener("mousemove", onDragMove);
    window.removeEventListener("mouseup", onDragEnd);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ------------------------------ navigation ------------------------------ */
  const goToday = () => setViewStart(addDays(today, -1));
  const goPrev = () => setViewStart((v) => addDays(v, -1));
  const goNext = () => setViewStart((v) => addDays(v, 1));

  const detailRes = reservations.find((r) => r.id === detailId) || null;

  /* ============================== RENDER ============================== */

  // FAZA 3: backend ma'lumoti yuklanmaguncha
  if (loading) {
    return (
      <div className="h-screen w-full flex items-center justify-center bg-gray-50">
        <div className="text-sm text-gray-500">Yuklanmoqda...</div>
      </div>
    );
  }

  if (needsLogin) {
    return (
      <LoginScreen
        onSuccess={() => {
          setNeedsLogin(false);
          setLoading(true);
          reload();
        }}
      />
    );
  }

  if (loadError) {
    return (
      <div className="h-screen w-full flex items-center justify-center bg-gray-50">
        <div className="max-w-sm text-center space-y-3">
          <div className="text-sm font-semibold text-red-700">Ma'lumotni yuklab bo'lmadi</div>
          <div className="text-xs text-gray-600">{loadError}</div>
          <div className="text-xs text-gray-400">Backend ishlab turganini tekshiring: {API_BASE || location.origin}</div>
          <Btn variant="primary" onClick={() => { setLoading(true); reload(); }}>Qayta urinish</Btn>
        </div>
      </div>
    );
  }

  return (
    <div className="h-screen w-full flex flex-col bg-gray-50 text-gray-900 font-sans select-none" style={{ fontFeatureSettings: '"tnum"' }}>
      <Toolbar
        viewStart={viewStart} today={today} rangeLen={rangeLen} zoomIdx={zoomIdx}
        onToday={goToday} onPrev={goPrev} onNext={goNext}
        onSetRange={setRangeLen} onSetViewStart={setViewStart}
        onZoomIn={() => setZoomIdx((i) => clamp(i + 1, 0, ZOOM_LEVELS.length - 1))}
        onZoomOut={() => setZoomIdx((i) => clamp(i - 1, 0, ZOOM_LEVELS.length - 1))}
        search={search} onSearch={setSearch}
        filtersOpen={filtersOpen} setFiltersOpen={setFiltersOpen} filters={filters} setFilters={setFilters}
        pricingOpen={pricingOpen} setPricingOpen={setPricingOpen}
        wsStatus={wsStatus}
        onAddReservation={() => setCreateDraft({ roomId: rooms[0].id, checkIn: toKey(today), checkOut: toKey(addDays(today, 1)) })}
      />

      <div className="flex-1 overflow-auto" ref={gridRef}>
        <div style={{ width: LEFT_WIDTH + days.length * cellWidth }}>
          {/* header row */}
          <div className="flex sticky top-0 z-30">
            <div className="sticky left-0 z-40 bg-gray-100 border-r border-b border-gray-200 flex items-center px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide" style={{ width: LEFT_WIDTH, height: HEADER_HEIGHT, minWidth: LEFT_WIDTH }}>
              Xona
            </div>
            {days.map((d) => {
              const isToday = isSameDay(d, today);
              const isWeekend = [0, 6].includes(d.getDay());
              return (
                <div key={toKey(d)}
                  className={`flex flex-col items-center justify-center border-r border-b border-gray-200 text-xs ${isToday ? "bg-blue-600 text-white" : isWeekend ? "bg-gray-100 text-gray-500" : "bg-gray-50 text-gray-500"}`}
                  style={{ width: cellWidth, height: HEADER_HEIGHT, minWidth: cellWidth }}>
                  <span className="font-semibold leading-tight">{fmtShort(d)}</span>
                  <span className="leading-tight opacity-80">{fmtWeekday(d)}</span>
                </div>
              );
            })}
          </div>

          {/* room rows */}
          {visibleRooms.map((room) => {
            // Bekor qilinganlar odatda gridda ko'rinmaydi — xona bo'sh
            // deb hisoblanadi. Lekin filtr aynan "Bekor qilingan"ga
            // qo'yilsa ularni ko'rsatamiz: aks holda filtr hech nima
            // topmaydi va bekor qilingan bron tarixini ko'rish
            // imkonsiz bo'ladi (TZ 2-band: tarix saqlanadi).
            const showCancelled = filters.resStatus === "cancelled";
            const roomReservations = reservations.filter(
              (r) => r.roomId === room.id && (showCancelled ? true : r.status !== "cancelled")
            );
            return (
              <div key={room.id} className="flex relative border-b border-gray-100" style={{ height: ROW_HEIGHT }}>
                <div
                  className="sticky left-0 z-20 bg-white border-r border-gray-200 flex flex-col justify-center px-3 cursor-pointer hover:bg-gray-50"
                  style={{ width: LEFT_WIDTH, minWidth: LEFT_WIDTH }}
                  onClick={(e) => setRoomMenu({ roomId: room.id, x: e.clientX, y: e.clientY })}
                >
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-sm text-gray-900">{room.number}</span>
                    <span className="text-xs text-gray-400">{typeLabel(room.type)}</span>
                  </div>
                  <div className="mt-1"><StatusBadge status={room.status} /></div>
                </div>

                <div className="relative" style={{ width: days.length * cellWidth, height: ROW_HEIGHT }}>
                  {days.map((d, i) => (
                    <div
                      key={i}
                      onClick={() => setCreateDraft({ roomId: room.id, checkIn: toKey(d), checkOut: toKey(addDays(d, 1)) })}
                      className={`absolute top-0 border-r border-gray-100 hover:bg-blue-50 cursor-cell ${isSameDay(d, today) ? "bg-blue-50" : ""}`}
                      style={{ left: i * cellWidth, width: cellWidth, height: ROW_HEIGHT }}
                    />
                  ))}

                  {roomReservations.map((res) => {
                    const isDragging = dragPreview && dragPreview.resId === res.id;
                    if (isDragging && dragPreview.roomId !== room.id) return null;
                    const showRes = isDragging ? { ...res, roomId: dragPreview.roomId, checkIn: dragPreview.checkIn, checkOut: dragPreview.checkOut } : res;
                    const ci = fromKey(showRes.checkIn), co = fromKey(showRes.checkOut);
                    const startOffset = diffDays(ci, viewStart);
                    const nights = nightsBetween(ci, co);
                    const left = startOffset * cellWidth;
                    const width = nights * cellWidth;
                    if (startOffset + nights <= 0 || startOffset >= days.length) return null;

                    const dimmed = (searchLower && !matchesSearch(res)) || !matchesFilter(res);
                    const highlighted = searchLower && matchesSearch(res);

                    return (
                      <ReservationBlock
                        key={res.id}
                        res={showRes} left={left} width={width}
                        dimmed={dimmed} highlighted={highlighted}
                        invalid={isDragging && !dragPreview.valid}
                        dragging={isDragging}
                        onOpen={() => !dragRef.current && setDetailId(res.id)}
                        onDragStart={(e, mode) => beginDrag(e, res, mode)}
                      />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Room quick menu */}
      {roomMenu && (
        <RoomQuickMenu
          room={rooms.find((r) => r.id === roomMenu.roomId)}
          x={roomMenu.x} y={roomMenu.y}
          reservations={reservations}
          today={today}
          priceForType={priceForType}
          onClose={() => setRoomMenu(null)}
          onNewReservation={(roomId) => { setRoomMenu(null); setCreateDraft({ roomId, checkIn: toKey(today), checkOut: toKey(addDays(today, 1)) }); }}
          onViewReservation={(id) => { setRoomMenu(null); setDetailId(id); }}
          onChangeStatus={(roomId, status) => { updateRoom(roomId, { status }); setRoomMenu(null); }}
          onMaintenanceBlock={(roomId) => { updateRoom(roomId, { status: "out_of_order" }); setRoomMenu(null); }}
        />
      )}

      {/* Bekor qilish jarimasi ogohlantirishi (SAVOLLAR.md S11) */}
      {cancelPrompt && (
        <Modal
          title="Bekor qilishda jarima"
          subtitle={`Xona ${cancelPrompt.res.roomId} · ${cancelPrompt.res.guestName}`}
          onClose={() => setCancelPrompt(null)}
          width={420}
          footer={<>
            <Btn onClick={() => setCancelPrompt(null)}>Orqaga</Btn>
            <Btn variant="danger" onClick={() => doCancel(cancelPrompt.res)}>
              Jarima bilan bekor qilish
            </Btn>
          </>}>
          <div className="space-y-3 text-sm">
            <div className="p-3 rounded-lg bg-red-50 border border-red-200">
              <div className="text-gray-700">Olinadigan jarima</div>
              <div className="text-xl font-semibold text-red-700 mt-1">
                {money(cancelPrompt.fee)}
              </div>
            </div>
            <div className="text-gray-600">
              Kirish sanasiga {cancelPrompt.hours} soatdan kam qoldi.
              Shu sababli 1 kecha narxi jarima sifatida olinadi.
            </div>
            <div className="text-gray-500 text-xs">
              Jarima daromad sifatida yoziladi va hisobotda ko'rinadi.
            </div>
          </div>
        </Modal>
      )}

      {/* Create reservation modal */}
      {createDraft && (
        <CreateReservationModal
          draft={createDraft} rooms={rooms} today={today} priceForType={priceForType}
          isRoomAvailable={isRoomAvailable}
          onClose={() => setCreateDraft(null)}
          onCreate={createReservation}
        />
      )}

      {/* Detail modal */}
      {detailRes && !subPanel && (
        <DetailModal
          res={detailRes} rooms={rooms} today={today}
          onClose={() => setDetailId(null)}
          onCheckIn={() => checkIn(detailRes)}
          onOpenCheckout={() => setSubPanel("checkout")}
          onOpenPayment={() => setSubPanel("payment")}
          onOpenCharge={() => setSubPanel("charge")}
          onOpenChangeRoom={() => setSubPanel("changeRoom")}
          onOpenChangeDates={() => setSubPanel("changeDates")}
          onCancel={() => cancelRes(detailRes)}
          onReversePayment={(p) => reversePayment(detailRes, p)}
        />
      )}

      {detailRes && subPanel === "payment" && (
        <PaymentModal res={detailRes} onClose={() => setSubPanel(null)}
          onAdd={(amt, method, note) => { addPayment(detailRes, amt, method, note); setSubPanel(null); }} />
      )}
      {detailRes && subPanel === "charge" && (
        <ChargeModal onClose={() => setSubPanel(null)}
          onAdd={(label, amt) => { addCharge(detailRes, label, amt); setSubPanel(null); }} />
      )}
      {detailRes && subPanel === "changeRoom" && (
        <ChangeRoomModal res={detailRes} rooms={rooms} availableRoomsFor={availableRoomsFor}
          onClose={() => setSubPanel(null)} onConfirm={(roomId) => changeRoom(detailRes, roomId)} />
      )}
      {detailRes && subPanel === "changeDates" && (
        <ChangeDatesModal res={detailRes} onClose={() => setSubPanel(null)}
          onConfirm={(ci, co) => changeDates(detailRes, ci, co)} />
      )}
      {detailRes && subPanel === "checkout" && (
        <CheckoutModal res={detailRes} onClose={() => setSubPanel(null)} onConfirm={() => checkOutRes(detailRes)} />
      )}

      {conflictMsg && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-600 text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-2 text-sm font-medium" style={{ zIndex: 200 }}>
          <AlertTriangle size={16} /> {conflictMsg}
          <button onClick={() => setConflictMsg(null)} className="ml-2 text-white/80 hover:text-white"><X size={14} /></button>
        </div>
      )}
    </div>
  );
}

    onZoomIn, onZoomOut, search, onSearch, filtersOpen, setFiltersOpen, filters, setFilters,
    pricingOpen, setPricingOpen, onAddReservation,
    wsStatus,
  } = props;

  return (
    <div className="border-b border-gray-200 bg-white z-40 relative">
      <div className="flex items-center gap-2 px-3 py-2 flex-wrap">
        <div className="flex items-center gap-1 mr-2">
          <div className="h-7 w-7 rounded-md bg-blue-600 flex items-center justify-center text-white font-bold text-xs">SH</div>
          <span className="font-semibold text-sm text-gray-800 mr-1">Shaxmatka</span>
          {/* FAZA 8: real-time ulanish holati (TZ 4-band).
              Yashil = event'lar keladi, sariq = uzilgan, qayta

        <div className="flex items-center rounded-md border border-gray-300 overflow-hidden">

          <button onClick={onToday} className="px-2.5 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50 border-r border-gray-300">Bugun</button>
          <button onClick={onNext} className="p-1.5 hover:bg-gray-50 text-gray-600"><ChevronRight size={16} /></button>

        <div className="relative flex-1 min-w-40 max-w-60">

          <input
            value={search} onChange={(e) => onSearch(e.target.value)}

          />
        </div>

        <div className="relative">
          <Btn variant={filtersOpen ? "primary" : "default"} onClick={() => { setFiltersOpen((o) => !o); setPricingOpen(false); }}>

        <div className="flex items-center rounded-md border border-gray-300 overflow-hidden">

          <button onClick={onZoomIn} className="p-1.5 hover:bg-gray-50 text-gray-600"><ZoomIn size={15} /></button>

        <div className="relative">
          <Btn variant={pricingOpen ? "primary" : "default"} onClick={() => { setPricingOpen((o) => !o); setFiltersOpen(false); }}>

        <div className="ml-auto">

        </SelectInput>

        <SelectInput value={filters.type} onChange={(e) => set("type", e.target.value)}>

          {Object.entries(ROOM_TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}

      <Btn className="w-full justify-center" onClick={() => setFilters({ floor: "all", type: "all", status: "all", source: "all", resStatus: "all" })}>Tozalash</Btn>
    </div>
  );
}

/* ==========================================================================
   NARXLAR PANELI — TZ 7-band, mijoz qarori Q8

   Manba: 07-AVAILABILITY-VA-RATES-SYNC.md §8

   Q8: avtomatik o'suvchi narx mexanizmi OLIB TASHLANDI. Eski
   formula `base + confirmedCount * increment` edi; `confirmedCount`
   faqat o'sardi, shuning uchun narx `max` ga tegib qotib qolardi va
   Booking.com'da sotilmaydigan darajaga chiqardi. TZ'da bunday
   mexanizm yo'q.

   Endi: admin narxni QO'LDA belgilaydi, o'zgarish Beds24 orqali
   OTA'ga ketadi. Har narx yonida sync holati ko'rinadi:
     ● yuborildi   ○ kutmoqda   ⚠ xato [↻]
========================================================================== */

function RateSyncDot({ status }) {
  const m = {
    synced:  { cls: "bg-emerald-500", title: "Beds24 qabul qildi" },
    pending: { cls: "bg-gray-300",    title: "Navbatda — Beds24'ga yuborilmoqda" },
    error:   { cls: "bg-red-500",     title: "Yuborilmadi — qayta urinib ko'ring" },
  }[status] || { cls: "bg-gray-200", title: "Narx belgilanmagan" };

  return <span className={`inline-block h-2 w-2 rounded-full ${m.cls}`} title={m.title} />;
}

function PricingPanel({ onClose }) {
  const today = useMemo(() => startOfDay(new Date()), []);
  const [from, setFrom] = useState(toKey(today));
  const [to, setTo] = useState(toKey(addDays(today, 6)));

  const [rates, setRates] = useState(null);      // null = yuklanmoqda
  const [draft, setDraft] = useState({});         // {roomTypeId: "35"}
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState(null);

  /**
   * Oraliqdagi narxlarni o'qiydi.
   *
   * Bir oraliqda turli kunlar turli narxda bo'lishi mumkin. Panel
   * bitta qiymat ko'rsatadi, shuning uchun: hammasi bir xil bo'lsa
   * o'sha narx, aks holda bo'sh (admin yangi narx kiritadi).
   */
  const load = useCallback(async () => {
    setRates(null);
    setError(null);
    try {
      const rows = await api.ratePlans(from, to);
      const byType = {};
      for (const r of rows) {
        (byType[r.roomTypeId] = byType[r.roomTypeId] || []).push(r);
      }

      const summary = {};
      for (const key of Object.keys(ROOM_TYPES)) {
        const list = byType[key] || [];
        const prices = [...new Set(list.map((r) => r.price))];
        const statuses = new Set(list.map((r) => r.syncStatus));
        summary[key] = {
          price: prices.length === 1 ? prices[0] : null,
          mixed: prices.length > 1,
          // Eng "yomon" holat ko'rsatiladi: xato > kutmoqda > yuborildi
          status: list.length === 0 ? null
            : statuses.has("error") ? "error"
            : statuses.has("pending") ? "pending"
            : "synced",
          days: list.length,
        };
      }
      setRates(summary);
      setDraft({});
    } catch (e) {
      setError(e.message);
      setRates({});
    }
  }, [from, to]);

  useEffect(() => { load(); }, [load]);

  const save = async () => {
    const prices = {};
    for (const [key, v] of Object.entries(draft)) {
      const n = Number(v);
      if (v !== "" && Number.isFinite(n) && n >= 0) prices[key] = n;
    }
    if (Object.keys(prices).length === 0) return;

    setSaving(true);
    setError(null);
    try {
      // DB'ga darhol yoziladi, Beds24'ga fonda ketadi (07-fayl §8) —
      // admin kutmaydi
      await api.setRates(from, to, prices);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
      await load();
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  const resync = async (roomTypeId) => {
    try {
      await api.resyncRates([roomTypeId], from, to);
      await load();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div className="absolute right-0 top-full mt-1 w-80 bg-white border border-gray-200 rounded-lg shadow-xl p-3.5 z-50 space-y-3">
      <div className="flex items-center justify-between">
        <span className="text-sm font-semibold text-gray-800">Narxlar</span>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X size={16} /></button>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <Field label="Dan">
          <TextInput type="date" value={from} onChange={(e) => setFrom(e.target.value)} />
        </Field>
        <Field label="Gacha">
          <TextInput type="date" value={to} onChange={(e) => setTo(e.target.value)} />
        </Field>
      </div>

          ))

          Object.entries(ROOM_TYPES).map(([key, type]) => {

            return (
              <div key={key} className="flex items-center gap-2">
                <span className="text-xs text-gray-600 w-24 flex-shrink-0">{type.label}</span>
                <TextInput
                  type="number" min={0}
                  placeholder={r.mixed ? "har xil" : r.price != null ? String(r.price) : "—"}
                  value={draft[key] ?? ""}
                  onChange={(e) => setDraft((d) => ({ ...d, [key]: e.target.value }))}
                />
                <div className="flex items-center gap-1 w-10 flex-shrink-0">
                  <RateSyncDot status={r.status} />
                  {r.status === "error" && (
                    <button onClick={() => resync(key)} title="Qayta yuborish"

function GuestDots({ count }) {
  if (!count) return null;
  return (
    <div className="flex items-center gap-0.5 flex-shrink-0" title={`${count} mehmon`}>
      {Array.from({ length: count }).map((_, i) => (
        <span key={i} className="block w-1.5 h-1.5 rounded-full bg-emerald-400 ring-1 ring-white/60" />
      ))}
    </div>
  );
}

function ReservationBlock({ res, left, width, dimmed, highlighted, invalid, dragging, onOpen, onDragStart }) {
  const src = SOURCES[res.source];
  /* Backend hisoblagan summa: nonushta va bekor qilish jarimasi
     ham kiradi (SAVOLLAR.md S10, S11). Eski javob uchun zaxira. */
  const total = res.totalPrice != null
    ? res.totalPrice
    : res.pricePerNight * nightsBetween(fromKey(res.checkIn), fromKey(res.checkOut)) + (res.charges || []).reduce((s, c) => s + c.amount, 0);
  const paid = (res.payments || []).reduce((s, p) => s + p.amount, 0);
  const remaining = total - paid;
  const isPast = res.status === "checked_out";
  const isCancelled = res.status === "cancelled";

  return (
    <div
      onClick={onOpen}
      className={`absolute top-1 bottom-1 rounded-md shadow-sm ${src.bar} ${src.text} px-2 py-1 flex flex-col justify-between overflow-hidden cursor-pointer
        ${dimmed ? "opacity-25" : "opacity-100"} ${highlighted ? "ring-2 ring-yellow-400" : ""}
        ${invalid ? "ring-2 ring-red-500 bg-red-500" : ""} ${dragging ? "shadow-2xl z-30" : "z-10"}
        ${isPast ? "opacity-60" : ""} ${isCancelled ? "opacity-30 line-through" : ""}`}
      style={{ left, width: Math.max(width - 4, 20), marginLeft: 2, transform: dragging ? "scale(1.02)" : undefined }}
      title={`${res.guestName} • ${src.label}`}
    >
      <div
        className="absolute left-0 top-0 bottom-0 w-2 cursor-ew-resize"
        onMouseDown={(e) => onDragStart(e, "resize-left")}
      />
      <div
        onMouseDown={(e) => onDragStart(e, "move")}
        className="flex-1 min-w-0"
      >
        <div className="flex items-center justify-between gap-1">
          <span className="text-xs font-semibold truncate">{res.guestName}</span>
          <div className="flex items-center gap-1 flex-shrink-0">
            {res.withMeal && <ChefHat size={12} />}
            <GuestDots count={res.adults + (res.children || 0)} />
          </div>
        </div>
        <div className="text-xs opacity-90 truncate">{src.label} · {res.adults + (res.children || 0)} mehmon</div>
      </div>
      <div className="flex items-center gap-1">
        {remaining > 0 ? (
          <span className="text-xs font-mono font-bold">{money(remaining)}</span>
        ) : (
          <Check size={13} strokeWidth={3} />
        )}
      </div>
      <div
        className="absolute right-0 top-0 bottom-0 w-2 cursor-ew-resize"
        onMouseDown={(e) => onDragStart(e, "resize-right")}
      />
    </div>
  );
}

/* ============================== ROOM QUICK MENU ============================== */

function RoomQuickMenu({ room, x, y, reservations, today, priceForType, onClose, onNewReservation, onViewReservation, onChangeStatus, onMaintenanceBlock }) {
  if (!room) return null;
  const current = reservations.find((r) => r.roomId === room.id && r.status !== "cancelled" && r.status !== "checked_out" &&
    fromKey(r.checkIn) <= today && fromKey(r.checkOut) > today);
  const next = reservations
    .filter((r) => r.roomId === room.id && r.status !== "cancelled" && fromKey(r.checkIn) > today)
    .sort((a, b) => fromKey(a.checkIn) - fromKey(b.checkIn))[0];

  const MARGIN = 8;
  const menuWidth = Math.min(256, window.innerWidth - MARGIN * 2);
  const maxLeft = Math.max(MARGIN, window.innerWidth - menuWidth - MARGIN);
  const maxTop = Math.max(MARGIN, window.innerHeight - MARGIN);
  const left = clamp(x, MARGIN, maxLeft);
  const top = Math.min(y, maxTop - MARGIN);
  const style = { left, top, width: menuWidth, maxHeight: `calc(100vh - ${top + MARGIN}px)` };

  return (
    <div className="fixed inset-0" style={{ zIndex: 90 }} onClick={onClose}>
      <div className="absolute bg-white rounded-lg shadow-2xl border border-gray-200 p-3 space-y-2 text-sm overflow-y-auto" style={style} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <span className="font-semibold text-gray-900">Xona {room.number}</span>
          <StatusBadge status={room.status} />
        </div>
        <div className="text-xs text-gray-500">{typeLabel(room.type)} · Bugungi narx {money(priceForType(room.type))}</div>

        <div className="border-t border-gray-100 pt-2 space-y-1">
          <div className="text-xs font-medium text-gray-400 uppercase tracking-wide">Joriy mehmon</div>
          {current ? (
            <button className="w-full text-left text-xs text-blue-700 hover:underline" onClick={() => onViewReservation(current.id)}>
              {current.guestName} — {fmtShort(fromKey(current.checkOut))}gacha
            </button>
          ) : <div className="text-xs text-gray-400">Yo'q</div>}
        </div>

        <div className="space-y-1">
          <div className="text-xs font-medium text-gray-400 uppercase tracking-wide">Keyingi bron</div>
          {next ? (
            <button className="w-full text-left text-xs text-blue-700 hover:underline" onClick={() => onViewReservation(next.id)}>
              {next.guestName} — {fmtShort(fromKey(next.checkIn))}
            </button>
          ) : <div className="text-xs text-gray-400">Rejalashtirilmagan</div>}
        </div>

        <div className="border-t border-gray-100 pt-2 space-y-1.5">
          <Btn className="w-full justify-center" variant="primary" onClick={() => onNewReservation(room.id)}><Plus size={13} /> Yangi bron</Btn>
          <div className="grid grid-cols-2 gap-1.5">
            <SelectInput value={room.status} onChange={(e) => onChangeStatus(room.id, e.target.value)} className="text-xs">
              {Object.entries(ROOM_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </SelectInput>
            <Btn onClick={() => onMaintenanceBlock(room.id)} className="justify-center"><Wrench size={13} /> Bloklash</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

function CreateReservationModal({ draft, rooms, today, priceForType, isRoomAvailable, onClose, onCreate }) {
  const room = rooms.find((r) => r.id === draft.roomId) || rooms[0];
  const [form, setForm] = useState({
    guestName: "", phone: "", checkIn: draft.checkIn, checkOut: draft.checkOut,
    adults: 2, children: 0, roomId: room.id, price: priceForType(room.type),
    source: "direct", paid: 0, notes: "", withMeal: false, priceReason: "",
  });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const selectedRoom = rooms.find((r) => r.id === form.roomId);
  const nights = nightsBetween(fromKey(form.checkIn), fromKey(form.checkOut));
  const total = nights * Number(form.price || 0);
  const available = form.roomId && form.checkIn && form.checkOut && fromKey(form.checkOut) > fromKey(form.checkIn)
    ? isRoomAvailable(form.roomId, form.checkIn, form.checkOut) : true;

  /* Chegirma: narx tarifdan past bo'lsa sabab talab qilinadi.
     Backend ham shu qoidani tekshiradi (SAVOLLAR.md S4) — bu
     yerdagi tekshiruv faqat qulaylik uchun: xodim "Bron yaratish"
     ni bosgandan keyin emas, darhol ko'radi. */
  const tariffPrice = selectedRoom ? priceForType(selectedRoom.type) : 0;
  const isDiscounted = tariffPrice > 0 && Number(form.price) < tariffPrice;
  const reasonOk = !isDiscounted || form.priceReason.trim().length >= 3;

  const canSubmit = form.guestName.trim() && fromKey(form.checkOut) > fromKey(form.checkIn) && available && Number.isFinite(Number(form.price)) && Number(form.price) >= 0 && reasonOk;

  return (
    <Modal title="Bron yaratish" subtitle={`Xona ${selectedRoom?.number} · ${typeLabel(selectedRoom?.type)}`} onClose={onClose}
      footer={<>
        <Btn onClick={onClose}>Bekor qilish</Btn>
        <Btn variant="primary" disabled={!canSubmit} onClick={() => onCreate(form)}>Bron yaratish</Btn>
      </>}>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Mehmon ismi"><TextInput value={form.guestName} onChange={(e) => set("guestName", e.target.value)} placeholder="To'liq ism" /></Field>
          <Field label="Telefon"><TextInput value={form.phone} onChange={(e) => set("phone", e.target.value)} placeholder="+998 ..." /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Kirish sanasi"><TextInput type="date" value={form.checkIn} onChange={(e) => set("checkIn", e.target.value)} /></Field>
          <Field label="Chiqish sanasi"><TextInput type="date" value={form.checkOut} onChange={(e) => set("checkOut", e.target.value)} /></Field>
        </div>
        <div className="grid grid-cols-3 gap-3">
          <Field label="Kattalar"><TextInput type="number" min={1} value={form.adults} onChange={(e) => set("adults", Number(e.target.value))} /></Field>
          <Field label="Bolalar"><TextInput type="number" min={0} value={form.children} onChange={(e) => set("children", Number(e.target.value))} /></Field>
          <Field label="Xona">
            <SelectInput value={form.roomId} onChange={(e) => { set("roomId", e.target.value); const r = rooms.find((x) => x.id === e.target.value); set("price", priceForType(r.type)); }}>
              {rooms.map((r) => <option key={r.id} value={r.id}>{r.number} · {typeLabel(r.type)}</option>)}
            </SelectInput>
          </Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Kechalik narx"><TextInput type="number" min={0} step="1" value={form.price} onChange={(e) => set("price", e.target.value)} /></Field>
          <Field label="Bron manbasi">
            <SelectInput value={form.source} onChange={(e) => set("source", e.target.value)}>
              {Object.entries(SOURCES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </SelectInput>
          </Field>
        </div>

        {/* Chegirma sababi — faqat narx tarifdan past bo'lsa.
            Backend ham shu qoidani tekshiradi: sababsiz past narx
            rad etiladi (SAVOLLAR.md S4). Maydon shu yerda
            ko'rinmasa, xodim tushunarsiz xato olardi. */}
        {isDiscounted && (
          <Field label={"Chegirma sababi (tarif " + money(tariffPrice) + ")"}>
            <TextInput
              value={form.priceReason}
              onChange={(e) => set("priceReason", e.target.value)}
              placeholder="Doimiy mijoz, guruh, kelishuv..."
            />
          </Field>
        )}
        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer select-none">
          <input type="checkbox" checked={form.withMeal} onChange={(e) => set("withMeal", e.target.checked)}
            className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
          <ChefHat size={15} className="text-gray-500" /> Ovqat bilan
        </label>
        <Field label="Hozir to'langan"><TextInput type="number" min={0} value={form.paid} onChange={(e) => set("paid", e.target.value)} /></Field>
        <Field label="Izoh"><textarea value={form.notes} onChange={(e) => set("notes", e.target.value)} rows={2} className={inputCls} /></Field>

        {!available && (
          <div className="flex items-center gap-2 text-xs text-red-600 bg-red-50 border border-red-200 rounded-md px-2.5 py-2">
            <AlertTriangle size={14} /> Xona to'qnashuvi — bu xona ushbu sanalarning bir qismida allaqachon band.
          </div>
        )}

        <div className="rounded-md bg-gray-50 border border-gray-200 p-2.5 flex justify-between text-sm">
          <span className="text-gray-500">{nights} kecha × {money(form.price || 0)}</span>
          <span className="font-mono font-semibold">{money(total)}</span>
        </div>
      </div>
    </Modal>
  );
}

  return (
    <Modal title="Xonani almashtirish" subtitle={`Hozirda Xona ${current?.number}`} onClose={onClose} width={400}
      footer={<><Btn onClick={onClose}>Bekor qilish</Btn><Btn variant="primary" disabled={!selected} onClick={() => onConfirm(selected)}>Tasdiqlash</Btn></>}>
      <div className="space-y-2">
        <div className="text-xs font-medium text-gray-400 uppercase tracking-wide">Ushbu sanalar uchun bo'sh xonalar</div>
        {available.length === 0 && <div className="text-sm text-gray-400">Bu sanalar uchun boshqa bo'sh xona yo'q.</div>}
        <div className="grid grid-cols-3 gap-2">
          {available.map((r) => (
            <button key={r.id} onClick={() => setSelected(r.id)}
              className={`rounded-md border px-2 py-2 text-sm font-medium flex flex-col items-center gap-0.5 ${selected === r.id ? "border-blue-600 bg-blue-50 text-blue-700" : "border-gray-200 hover:bg-gray-50 text-gray-700"}`}>
              {r.number}
              <span className="text-xs text-gray-400">{typeLabel(r.type)}</span>
            </button>
          ))}
        </div>
      </div>
    </Modal>
  );
}

function ChangeDatesModal({ res, onClose, onConfirm }) {
  const [checkIn, setCheckIn] = useState(res.checkIn);
  const [checkOut, setCheckOut] = useState(res.checkOut);
  return (
    <Modal title="Sanalarni o'zgartirish" subtitle={res.guestName} onClose={onClose} width={380}
      footer={<><Btn onClick={onClose}>Bekor qilish</Btn><Btn variant="primary" onClick={() => onConfirm(checkIn, checkOut)}>Saqlash</Btn></>}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Kirish sanasi"><TextInput type="date" value={checkIn} onChange={(e) => setCheckIn(e.target.value)} /></Field>
        <Field label="Chiqish sanasi"><TextInput type="date" value={checkOut} onChange={(e) => setCheckOut(e.target.value)} /></Field>
      </div>
    </Modal>
  );
}

function CheckoutModal({ res, onClose, onConfirm }) {
  const nights = nightsBetween(fromKey(res.checkIn), fromKey(res.checkOut));
  const chargesTotal = (res.charges || []).reduce((s, c) => s + c.amount, 0);

  /* Jami summa BACKENDDAN olinadi: u nonushtani ham hisoblaydi
     (SAVOLLAR.md S10). Mahalliy hisob eski formulada qolib,
     mehmon kam to'lardi. `totalPrice` bo'lmasa (eski javob)
     mahalliy hisobga qaytamiz. */
  const mealTotal = res.mealTotal || 0;
  const total = res.totalPrice != null
    ? res.totalPrice
    : res.pricePerNight * nights + chargesTotal + mealTotal;
  const paid = res.paidAmount != null
    ? res.paidAmount
    : (res.payments || []).reduce((s, p) => s + p.amount, 0);
  const remaining = total - paid;
  return (
    <Modal title="Chiqish" subtitle={res.guestName} onClose={onClose} width={380}
      footer={<><Btn onClick={onClose}>Bekor qilish</Btn><Btn variant="primary" onClick={onConfirm}><LogOut size={14} /> Chiqishni tasdiqlash</Btn></>}>
      <div className="space-y-2 text-sm">
        <div className="flex justify-between"><span className="text-gray-500">Xona narxi</span><span className="font-mono">{money(res.pricePerNight * nights)}</span></div>
        {mealTotal > 0 && (
          <div className="flex justify-between"><span className="text-gray-500">Nonushta</span><span className="font-mono">{money(mealTotal)}</span></div>
        )}
        <div className="flex justify-between"><span className="text-gray-500">Qo'shimcha xarajatlar</span><span className="font-mono">{money(chargesTotal)}</span></div>
        <div className="flex justify-between border-t border-gray-100 pt-2"><span className="text-gray-500">Jami</span><span className="font-mono font-semibold">{money(total)}</span></div>
        <div className="flex justify-between"><span className="text-gray-500">To'langan</span><span className="font-mono">{money(paid)}</span></div>
        <div className={`flex justify-between font-semibold border-t border-gray-100 pt-2 ${remaining > 0 ? "text-red-600" : "text-emerald-600"}`}>
          <span>Qolgan qarz</span><span className="font-mono">{money(Math.max(remaining, 0))}</span>
        </div>
        {remaining > 0 && (
          <div className="flex items-center gap-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-2.5 py-2">
            <AlertTriangle size={13} /> Mehmonning {money(remaining)} qarzi bor. Chiqishni tasdiqlab, keyinroq hisob-kitob qilishingiz mumkin.
          </div>
        )}
      </div>
    </Modal>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
